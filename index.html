<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amar Bazar - Online Shopping</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .active-tab {
            border-bottom: 4px solid #2563eb;
            color: #2563eb;
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

    <!-- Header -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-600 flex items-center gap-2">
                <i class="fa-solid font-bag-shopping"></i> Amar Bazar
            </h1>
            <div id="cart-count" class="bg-blue-100 text-blue-800 text-sm font-semibold px-3 py-1 rounded-full">
                Products Live
            </div>
        </div>

        <!-- Navigation Tabs (3 Parts / Layers) -->
        <nav class="bg-gray-100 border-b border-gray-200">
            <div class="max-w-6xl mx-auto flex justify-center space-x-8 text-lg py-3">
                <button onclick="filterCategory('men')" id="tab-men" class="active-tab px-4 py-1 transition-all">
                    👨 Men (Seledar)
                </button>
                <button onclick="filterCategory('women')" id="tab-women" class="px-4 py-1 transition-all">
                    👩 Women (Meyedar)
                </button>
                <button onclick="filterCategory('kids')" id="tab-kids" class="px-4 py-1 transition-all">
                    👶 Kids (Shishudar)
                </button>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow">
        <!-- Loading Spinner -->
        <div id="loading" class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500"></div>
            <p class="mt-3 text-gray-600">Product loading hocche...</p>
        </div>

        <!-- Product Grid -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 hidden">
            <!-- Dynamic Products Will Appear Here -->
        </div>

        <!-- Empty Message -->
        <div id="empty-msg" class="text-center text-gray-500 py-12 hidden">
            Ei category-te kono product pawa jayni.
        </div>
    </main>

    <!-- Order Modal -->
    <div id="order-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50 p-4">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md relative">
            <button onclick="closeModal()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
            <h2 class="text-xl font-bold mb-4 text-gray-800 border-b pb-2">Order Information</h2>
            
            <div id="modal-product-info" class="mb-4 bg-gray-50 p-3 rounded-md border">
                <!-- Selected product details -->
            </div>

            <form id="order-form" onsubmit="handleOrderSubmit(event)" class="space-y-3">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Apnar Naam *</label>
                    <input type="text" id="cust-name" required class="w-full border rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Phone Number *</label>
                    <input type="tel" id="cust-phone" required class="w-full border rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Thikana / Location *</label>
                    <textarea id="cust-address" required rows="2" class="w-full border rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">FB ID / Social Profile Link (Optional)</label>
                    <input type="text" id="cust-social" placeholder="https://facebook.com/yourid" class="w-full border rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                
                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 rounded-md transition-all flex items-center justify-center gap-2">
                    <i class="fa-brands fa-whatsapp text-lg"></i> WhatsApp-e Order Pathan
                </button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-6 text-center text-sm mt-auto">
        <p>&copy; 2026 Amar Bazar. All rights reserved.</p>
    </footer>

    <!-- Script -->
    <script>
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQlk2mv_lict5H-adyo7WEoOWKYPe3zirkTV1qYmajWA23LoAPpEXubkl-7EafzYpzuM6Ln23Ojr-/pub?gid=0&single=true&output=csv";

        let allProducts = [];
        let currentCategory = 'men';
        let selectedProduct = null;

        async function loadProducts() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                const csvText = await response.text();
                
                allProducts = parseCSV(csvText);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('product-grid').classList.remove('hidden');
                
                filterCategory(currentCategory);
            } catch (error) {
                console.error("Error loading sheet:", error);
                document.getElementById('loading').innerHTML = "<p class='text-red-500'>Product load hote shomoshya hoyeche.</p>";
            }
        }

        function parseCSV(text) {
            const lines = text.trim().split('\n');
            const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
            const data = [];

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const values = lines[i].split(',').map(v => v.trim());
                let row = {};
                headers.forEach((header, index) => {
                    row[header] = values[index] || '';
                });
                data.push(row);
            }
            return data;
        }

        function filterCategory(category) {
            currentCategory = category;

            ['men', 'women', 'kids'].forEach(tab => {
                const el = document.getElementById(`tab-${tab}`);
                if (tab === category) {
                    el.classList.add('active-tab');
                } else {
                    el.classList.remove('active-tab');
                }
            });

            const filtered = allProducts.filter(p => p.category && p.category.toLowerCase() === category);
            renderProducts(filtered);
        }

        function renderProducts(products) {
            const grid = document.getElementById('product-grid');
            const emptyMsg = document.getElementById('empty-msg');
            grid.innerHTML = '';

            if (products.length === 0) {
                emptyMsg.classList.remove('hidden');
                return;
            } else {
                emptyMsg.classList.add('hidden');
            }

            products.forEach(p => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-lg shadow border overflow-hidden flex flex-col justify-between";
                
                const imgSrc = p.img || 'https://via.placeholder.com/300';
                const discPrice = p.discount_price ? `<span class="text-sm text-gray-400 line-through ml-2">৳${p.discount_price}</span>` : '';

                card.innerHTML = `
                    <div>
                        <img src="${imgSrc}" alt="${p.name}" class="w-full h-48 object-cover">
                        <div class="p-4">
                            <h3 class="font-semibold text-lg text-gray-800">${p.name}</h3>
                            <div class="mt-2 flex items-baseline">
                                <span class="text-xl font-bold text-blue-600">৳${p.price}</span>
                                ${discPrice}
                            </div>
                        </div>
                    </div>
                    <div class="p-4 pt-0">
                        <button onclick="openOrderModal('${p.id}')" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded font-semibold transition-colors">
                            Order Now
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openOrderModal(productId) {
            selectedProduct = allProducts.find(p => p.id == productId);
            if(!selectedProduct) return;

            const infoDiv = document.getElementById('modal-product-info');
            infoDiv.innerHTML = `
                <p class="font-bold text-gray-800">${selectedProduct.name}</p>
                <p class="text-sm text-blue-600 font-semibold">Price: ৳${selectedProduct.price}</p>
            `;

            document.getElementById('order-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('order-modal').classList.add('hidden');
        }

        function handleOrderSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            const address = document.getElementById('cust-address').value;
            const social = document.getElementById('cust-social').value;

            // Updated with your exact WhatsApp Number
            const ownerPhone = "8801891962606";

            let msg = `*New Order Details*\n\n`;
            msg += `*Product:* ${selectedProduct.name}\n`;
            msg += `*Price:* ৳${selectedProduct.price}\n`;
            msg += `--------------------------\n`;
            msg += `*Customer Name:* ${name}\n`;
            msg += `*Phone:* ${phone}\n`;
            msg += `*Address:* ${address}\n`;
            if(social) msg += `*FB/Social Link:* ${social}\n`;

            const waUrl = `https://wa.me/${ownerPhone}?text=${encodeURIComponent(msg)}`;
            window.open(waUrl, '_blank');
            closeModal();
        }

        window.onload = loadProducts;
    </script>
</body>
</html>
